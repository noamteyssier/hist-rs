[package]
name = "hist-rs"
version = "0.1.8"
edition = "2024"
description = "High-throughput method to count abundance of unique line in the style of `sort | uniq -c`"
readme = "README.md"
license = "MIT"
repository = "https://github.com/noamteyssier/hist-rs"
categories = ["command-line-utilities"]
keywords = ["histogram", "sort", "count", "uniq", "unique"]

[[bin]]
name = "hist"
path = "src/main.rs"

[[bench]]
name = "default_file"
harness = false

[dependencies]
anyhow = "1.0.100"
bstr = "1.12.0"
bumpalo = "3.19.0"
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.4.0"
hashbrown = "0.16.0"
num_cpus = "1.17.0"
regex = "1.12.2"

[dev-dependencies]
assert_cmd = "2.1.1"
criterion = "0.8.1"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
tempfile = "3.23.0"

[profile.release]
lto = true
codegen-units = 1
debug = false
