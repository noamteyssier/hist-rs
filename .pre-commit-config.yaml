repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt check
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check
        language: system
        always_run: true
        pass_filenames: false
